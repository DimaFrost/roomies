name: Roomies
options:
  bundleIdPrefix: com.madebyfrost
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "3KNHY9UU4M"
    CODE_SIGN_STYLE: Automatic
targets:
  Roomies:
    type: application
    platform: iOS
    sources:
      - path: Roomies/Sources
    info:
      path: Roomies/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        CFBundleDisplayName: at our place
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        # These must reference the build settings rather than be left to XcodeGen's defaults,
        # which hardcode 1 / 1.0 — bumping CURRENT_PROJECT_VERSION below then silently produced
        # another "build 1" archive, which App Store Connect rejects as a duplicate.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSCalendarsFullAccessUsageDescription: Roomies reads your calendar to show flatmates when you're busy or away. Event names stay on your device unless you choose to share them.
        NSCalendarsUsageDescription: Roomies reads your calendar to show flatmates when you're busy or away. Event names stay on your device unless you choose to share them.
    entitlements:
      path: Roomies/Roomies.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.madebyfrost.roomies
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.madebyfrost.roomies"
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madebyfrost.roomies
        PRODUCT_NAME: Roomies
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "11"
